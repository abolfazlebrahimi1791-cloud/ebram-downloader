name: Download and Split File

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک فایل (مستقیم یا گوگل درایو)'
        required: true
        type: string

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # برای اجازه Push کردن کد به ریپازیتوری
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install gdown requests

      - name: Download and Split
        env:
          FILE_URL: ${{ github.event.inputs.url }}
        run: python process.py

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add downloaded and split file from URL" || echo "تغییری برای کامیت وجود ندارد"
          git push
